<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.2) translate(25px, -15px); opacity: 0.55; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 200; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 260px;
    }
    .data-stream {
      stroke-dasharray: 8 12;
      animation: dashMove 12s linear infinite;
    }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill3 5.5s ease-in-out infinite; }

    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay in Background -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Background Dynamic Glowing Orbs (Safely Kept Far in Background) -->
  <circle class="orb-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="270" r="150" fill="#a855f7" filter="url(#glow)" />

  <!-- Animated Circuit Flow Lines (Background Layer) -->
  <path class="data-stream" d="M 50 180 Q 250 80 450 180 T 850 180 T 1150 180" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />
  <path class="data-stream" d="M 100 300 C 300 240, 500 320, 700 260 S 1000 240, 1120 310" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Floating Feature Badges (Positioned cleanly below header without obstructing text) -->
  <g class="pill-1" filter="url(#card-shadow)">
    <rect x="180" y="278" width="180" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="202" cy="297" r="5" fill="#38bdf8" />
    <text class="badge-text" x="218" y="302" fill="#e2e8f0">⚡ Agentic IDEs</text>
  </g>

  <g class="pill-2" filter="url(#card-shadow)">
    <rect x="390" y="278" width="220" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="412" cy="297" r="5" fill="#818cf8" />
    <text class="badge-text" x="428" y="302" fill="#e2e8f0">🧠 Codebase RAG &amp; Chat</text>
  </g>

  <g class="pill-3" filter="url(#card-shadow)">
    <rect x="640" y="278" width="200" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="662" cy="297" r="5" fill="#c084fc" />
    <text class="badge-text" x="678" y="302" fill="#e2e8f0">💻 Terminal Copilots</text>
  </g>

  <g class="pill-1" filter="url(#card-shadow)">
    <rect x="870" y="278" width="160" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="892" cy="297" r="5" fill="#34d399" />
    <text class="badge-text" x="908" y="302" fill="#e2e8f0">🌐 Open Source</text>
  </g>

  <!-- High-Contrast Top Banner Tag -->
  <g filter="url(#card-shadow)">
    <rect x="440" y="38" width="320" height="30" rx="15" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-opacity="0.5" />
    <text class="badge-text" x="600" y="58" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">🚀 CURATED AI DEVELOPER ECOSYSTEM</text>
  </g>

  <!-- Foreground Title and Subtitle (Unobscured and Crystal Clear) -->
  <!-- Subtle back-plate to guarantee 100% foreground contrast -->
  <text class="title-text" x="600" y="142" font-size="46" fill="url(#accent-cyan-purple)" text-anchor="middle">
    Awesome AI Coding Assistants
  </text>

  <text class="sub-text" x="600" y="195" font-size="18" fill="#cbd5e1" text-anchor="middle">
    The Definitive Guide to Autonomous Coding Agents, AI-First IDEs &amp; Pair Programmers
  </text>

  <text class="sub-text" x="600" y="226" font-size="14" fill="#94a3b8" text-anchor="middle">
    Compare Commercial SaaS Leaders &amp; Open-Source Self-Hosted Copilots • October 2026
  </text>

  <!-- Glowing divider line under subtitle -->
  <line x1="380" y1="250" x2="820" y2="250" stroke="url(#glow-grad)" stroke-width="2" stroke-linecap="round" />
</svg>
